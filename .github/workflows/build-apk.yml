name: Build Android APK (استخراج تطبيق أندرويد)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: 'رقم الإصدار (مثال: 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: بناء وتجهيز ملف الـ APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 تنزيل كود المستودع (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ إعداد بيئة Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 إعداد حزمة تطوير أندرويد (Android SDK)
        uses: android-actions/setup-android@v3

      - name: 📦 تثبيت حزم المشروع (Install Dependencies)
        run: |
          npm ci || npm install

      - name: 🏗️ بناء تطبيق الويب (Build Web Assets)
        run: |
          npm run build

      - name: 🔄 تهيئة وإعداد منصة أندرويد عبر Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "إضافة منصة أندرويد لأول مرة..."
            npx cap add android
          fi
          echo "مزامنة ملفات الويب مع مشروع أندرويد..."
          npx cap sync android

      - name: 🔑 إعطاء صلاحية التشغيل لـ Gradle
        run: |
          chmod +x android/gradlew

      - name: 🔨 تجميع وبناء ملف الـ APK (Assemble Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📂 نقل وتجهيز ملف الـ APK النهائي
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/ -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "تم العثور على ملف APK في: $APK_PATH"
            cp "$APK_PATH" output-apk/MohamedTaleb-Accounting.apk
            ls -la output-apk/
          else
            echo "خطأ: لم يتم العثور على ملف APK!"
            exit 1
          fi

      - name: 🚀 رفع ملف الـ APK في Actions Artifacts للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: MohamedTaleb-Accounting-APK
          path: output-apk/MohamedTaleb-Accounting.apk
          retention-days: 30

      - name: 🏷️ إنشاء إصدار وتوفير رابط تحميل دائم (GitHub Release)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/MohamedTaleb-Accounting.apk
          name: "تطبيق النظام المحاسبي - محمد طالب (APK v${{ github.event.inputs.release_version || '1.0.0' }})"
          tag_name: "v${{ github.event.inputs.release_version || '1.0.0' }}-${{ github.run_number }}"
          body: |
            ### 📱 تطبيق النظام المحاسبي - محمد طالب جاهز للتحميل والتثبيت!
            
            - **اسم التطبيق:** النظام المحاسبي الذكي
            - **صاحب التطبيق:** محمد طالب
            - **اسم الملف:** `MohamedTaleb-Accounting.apk`
            - **رقم البناء:** ${{ github.run_number }}
            
            #### 📥 طريقة التثبيت على هاتفك الأندرويد:
            1. اضغط على رابط الملف أدناه لتحميل `MohamedTaleb-Accounting.apk`
            2. افتح الملف المحمّل في هاتفك واضغط على **تثبيت (Install)**.
            3. إذا ظهر تنبيه الأمان، اختر "السماح بالتثبيت من هذا المصدر".
            4. سيظهر تطبيق النظام المحاسبي كأيقونة مستقلة على شاشة هاتفك الرئيسية، ويعمل دون أي مشاكل!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
